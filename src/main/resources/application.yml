spring:
  application:
    name: helpcar-backend

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/helpcar}
    username: ${DATABASE_USERNAME:helpcar}
    password: ${DATABASE_PASSWORD:}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:10}
      pool-name: helpcar-pool

  jpa:
    # Flyway owns the schema; Hibernate only verifies that entities match it.
    hibernate:
      ddl-auto: validate
    # Off by default: lazy loading in the view layer hides N+1 queries and holds
    # connections for the whole request.
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 25

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s

  mvc:
    problemdetails:
      enabled: true

  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: false

  threads:
    virtual:
      # Java 21 virtual threads: one carrier thread pool no longer caps concurrent
      # requests, which matters for the routing-engine calls in the matching pipeline.
      enabled: true

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  info:
    env:
      enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

helpcar:
  version: ${HELPCAR_VERSION:0.1.0-SNAPSHOT}
  matching:
    # Stage 1: how far off a helper's route we will still consider a pickup.
    max-search-radius-meters: ${MATCHING_SEARCH_RADIUS_M:5000}
    # Stage 2/3: the detour budget a helper is assumed to tolerate.
    max-detour-meters: ${MATCHING_MAX_DETOUR_M:3000}
    # Stage 1 hard cap, so a dense city never loads an unbounded candidate set.
    max-candidates: ${MATCHING_MAX_CANDIDATES:100}
    # Stage 4 ranking weights — must sum to 1.0.
    weight-detour: 0.5
    weight-wait-time: 0.3
    weight-reliability: 0.2

logging:
  level:
    com.helpcar: INFO
